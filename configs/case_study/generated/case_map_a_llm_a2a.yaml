environment:
  horizon: 120
  orders:
  - boiled_egg
  - baked_potato_slices
  - sliced_bell_pepper_and_corn_stew
  layout: heterogeneous_map_a
  max_steps: 120
  num_concurrent_tasks: 3
  max_total_tasks: 3
  max_clean_dishes: 6
  wash_time: 5
  global_scheduler:
    enabled: true
    mode: llm
    timeout_steps: 15
    clean_dish_threshold: 6
    verbose: true
    role_capabilities:
      chef:
      - cook_task
      assistant:
      - cook_task
      dishwasher:
      - wash_task
    model: qwen3.5-plus
    temperature: 0.0
    max_tokens: 512
    fallback_to_rule: true
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
run:
  episode: 1
  mode: exp
  test_mode: fix_task
  p0: LLMPair
  p1: LLMPair
  collab_mode: llm
  llm_model: qwen3.5-plus
  history_window: 3
  run_id: case_map_a_llm_a2a
  results_root: /Users/lijiayi/Desktop/graduate project/code/Collab-Overcooked/results/a2a_case_study
