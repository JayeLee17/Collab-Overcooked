      - cook_task
      assistant:
      - cook_task
      dishwasher:
      - wash_task
    model: qwen3.5-plus
    temperature: 0.0
    max_tokens: 512
    fallback_to_rule: true
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
