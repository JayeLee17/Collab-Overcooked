environment:
  horizon: 100
  orders:
  - boiled_egg
  - baked_potato_slices
  - baked_carrot_soup
  - sliced_bell_pepper_and_corn_stew
  layout: multi_agent_map
  max_steps: 100
  num_concurrent_tasks: 4
  max_total_tasks: 4
  max_clean_dishes: 6
  wash_time: 5
  global_scheduler:
    enabled: true
    mode: llm
    timeout_steps: 5
    clean_dish_threshold: 3
    verbose: true
    role_capabilities:
      chef:
      - cook_task
      assistant:
      - cook_task
      dishwasher:
      - wash_task
    model: qwen3.5-plus
    temperature: 0.0
    max_tokens: 512
    fallback_to_rule: true
    api_key: sk-0dfb7f07d81e4f8a8912a74488e3ebc2
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
run:
  episode: 1
  mode: exp
  test_mode: fix_task
  p0: LLMPair
  p1: LLMPair
  collab_mode: llm
  llm_model: qwen3.5-plus
  history_window: 3
  run_id: E8_llm_T100
agents:
  num_agents: 5
  agent_0:
    type: custom_api
    model: qwen3.5-plus
    api_key: sk-0dfb7f07d81e4f8a8912a74488e3ebc2
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.1
    max_tokens: 512
    timeout: 120
    max_retries: 3
    role: Chef
