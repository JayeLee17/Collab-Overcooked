# Default configuration for Collab-Overcooked
# Note: This file contains a working API key configuration
# For personal testing, copy this to configs/test_personal.yaml and modify as needed

# Environment settings
environment:
  horizon: 400           # 多任务场景需要更多步数
  # 方式1: 单一 order（所有任务都做同一个菜）
  # order: "boiled_egg"
  # 方式2: orders 列表（每个任务做不同的菜，会轮转补充）
  orders:
    - "boiled_egg"
    - "baked_carrot_soup"
  layout: "multi_agent_map"  # Available: cramped_room, multi_agent_map, coordination_ring, etc.
  max_steps: 400
  num_concurrent_tasks: 2    # 同时保持的活跃任务数量
  max_total_tasks: 2         # 最大总任务数（0=无限制，仅完成初始任务后补充）
  # 盘子管理参数（仅在使用支持W符号的地图时有效）
  max_clean_dishes: 6        # D处盘子数量上限
  wash_time: 5               # W处清洗时间（步数）
  # 可插拔全局调度器（用于对比实验）
  global_scheduler:
    enabled: true
    mode: "capability_busy"   # capability_busy | off
    timeout_steps: 8          # 分配后若无进展超过该步数，触发重派
    clean_dish_threshold: 3   # clean_dish < threshold 且 dirty_dish > 0 时触发洗碗分配
    verbose: true
    role_capabilities:
      chef: ["cook_task"]
      assistant: ["cook_task"]
      dishwasher: ["wash_task"]

# Runtime / control loop settings
run:
  episode: 1
  mode: "exp"              # exp | develop
  test_mode: "fix_task" # single_task | fix_task
  p0: "LLMPair"
  p1: "LLMPair"
  collab_mode: "llm"
  llm_model: "gpt-3.5-turbo"
  history_window: 3
  
# Agent settings
agents:
  num_agents: 5  # 匹配 multi_agent_map 地图的5个玩家位置
  agent_0:
    type: "custom_api"  # openai, vllm, custom_api
    model: "gpt-4o"
    api_key: "sk-ncjH2QRKjo78piTA48Ofm9aU7sCAoNLKLxhUiHQ5vT3tMo51"  # Required for OpenAI/custom API
    base_url: "https://api2.aigcbest.top/v1"  # Optional for OpenAI, required for custom_api
    temperature: 0.1
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"  # A0: Chef
  agent_1:
    type: "custom_api"
    model: "gpt-4o"
    api_key: "sk-ncjH2QRKjo78piTA48Ofm9aU7sCAoNLKLxhUiHQ5vT3tMo51"  # Required for OpenAI/custom API
    base_url: "https://api2.aigcbest.top/v1"
    temperature: 0.1
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"  # A1: Assistant
  agent_2:
    type: "custom_api"
    model: "gpt-3.5-turbo"
    api_key: "sk-ncjH2QRKjo78piTA48Ofm9aU7sCAoNLKLxhUiHQ5vT3tMo51"  # Required for OpenAI/custom API
    base_url: "https://api2.aigcbest.top/v1"
    temperature: 0.1
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Dishwasher"  # A2: Dishwasher
  agent_3:
    type: "custom_api"
    model: "gpt-4o"
    api_key: "sk-ncjH2QRKjo78piTA48Ofm9aU7sCAoNLKLxhUiHQ5vT3tMo51"  # Required for OpenAI/custom API
    base_url: "https://api2.aigcbest.top/v1"
    temperature: 0.1
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Assistant"  # A3: Assistant
  agent_4:
    type: "custom_api"
    model: "gpt-4o"
    api_key: "sk-ncjH2QRKjo78piTA48Ofm9aU7sCAoNLKLxhUiHQ5vT3tMo51"  # Required for OpenAI/custom API
    base_url: "https://api2.aigcbest.top/v1"
    temperature: 0.1
    max_tokens: 512
    timeout: 30
    max_retries: 3
    role: "Chef"  # A4: Chef

# Evaluation settings
evaluation:
  metrics:
    - "f1_score"
    - "similarity"
    - "redundancy"
    - "collaboration_initiate"
    - "collaboration_respond"
  output_dir: "./results"
  save_trajectories: true
  
# Logging settings
logging:
  level: "INFO"
  save_logs: true
  log_dir: "./logs"
  
# Paths
paths:
  prompts_dir: "./collab_overcooked/prompts"
  layouts_dir: "./dependencies/overcooked_ai/overcooked_ai_py/data/layouts"
  results_dir: "./results"
